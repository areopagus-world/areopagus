name: Decision
description: A choice that needs to be made and recorded as an ADR
labels: [decision]
body:
  - type: textarea
    id: question
    attributes:
      label: The question
      description: One sentence, answerable with a choice.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Each option with what it costs and what it rules out.
    validations:
      required: true
  - type: textarea
    id: blocks
    attributes:
      label: What this blocks
  - type: input
    id: who
    attributes:
      label: Who decides
