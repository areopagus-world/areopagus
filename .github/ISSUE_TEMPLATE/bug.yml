name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Device, browser, app version or commit.
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here. See SECURITY.md for how to report them privately.
