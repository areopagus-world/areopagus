name: deploy-web

# Sends the network app to Clever Cloud on every change merged into main, then checks it answers.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/site/**"
      - "scripts/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the Clever Cloud application exists and its id is set as a repository variable.
    if: vars.CLEVER_APP_ID != ''
    runs-on: ubuntu-latest
    env:
      CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
      CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
      HEALTH_URL: ${{ vars.WEB_HEALTH_URL || 'https://beta.areopagus.world/api/health' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Clever Tools
        run: npm install --global clever-tools

      - name: Deploy
        run: |
          clever link "${{ vars.CLEVER_APP_ID }}"
          # A manual re-run on an unchanged commit restarts the app instead of failing.
          clever deploy --force --same-commit-policy restart

      - name: Smoke check
        run: |
          # Healthy is not enough: the answer must come from the commit just deployed.
          # If the platform does not report a commit, fall back to the plain health check.
          for attempt in 1 2 3 4 5 6 7 8 9; do
            body=$(curl --fail --silent --show-error "$HEALTH_URL" || true)
            echo "$body"
            if echo "$body" | grep -q '"ok":true'; then
              if echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""; then exit 0; fi
              if echo "$body" | grep -q '"commit":null'; then echo "No commit reported, accepting health only"; exit 0; fi
            fi
            sleep 20
          done
          echo "The app did not report healthy on $GITHUB_SHA" && exit 1
